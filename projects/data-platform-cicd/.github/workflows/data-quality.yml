name: demo-data-quality

on:
  push:
    paths:
      - "projects/data-platform-cicd/**"
  pull_request:
    paths:
      - "projects/data-platform-cicd/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas pytest
      - run: pytest projects/data-platform-cicd/tests -q
      - run: docker build -t demo-data-pipeline projects/data-platform-cicd
